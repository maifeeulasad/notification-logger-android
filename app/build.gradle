plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

// Release signing is supplied by the environment (CI) or by a gradle.properties outside
// version control. When nothing is configured the release build simply stays unsigned
// rather than failing, so a plain `assembleRelease` still works for local checks.
def keystorePath = System.getenv('RELEASE_KEYSTORE') ?: findProperty('release.keystore')
def hasReleaseSigning = keystorePath != null && file(keystorePath).exists()

android {
    namespace 'com.mua.roti'
    compileSdk 36

    defaultConfig {
        applicationId "com.mua.roti"
        minSdk 16
        targetSdk 36
        versionCode 3
        versionName "1.2"

        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // NDK configuration
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        
        // External native build for CMake and ndk-build
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD') ?: findProperty('release.keystore.password')
                keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: findProperty('release.key.alias')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: findProperty('release.key.password')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }

    // External native build configuration
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // android-x
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // fragment
    implementation 'androidx.fragment:fragment-ktx:1.6.0'

    // material library
    implementation 'com.google.android.material:material:1.9.0'

    // ui - recycler view, card view,
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.cardview:cardview:1.0.0"

    // room - database
    implementation "androidx.room:room-runtime:2.5.1"
    kapt "androidx.room:room-compiler:2.5.1"

    // rxjava - observer
    implementation 'io.reactivex.rxjava2:rxjava:2.2.16'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    // multidex - for supporting more classes
    implementation "androidx.multidex:multidex:2.0.1"

    // flow, livedata all together
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.1"

    // datastore - think of it as `localStorage`
    implementation "androidx.datastore:datastore-preferences:1.0.0-alpha06"


    // hilt - dagger dependency injection
    implementation "com.google.dagger:hilt-android:2.31-alpha"
    kapt "com.google.dagger:hilt-android-compiler:2.30.1-alpha"
    kapt 'androidx.hilt:hilt-compiler:1.0.0'

    // worker
    implementation "androidx.work:work-runtime:2.9.0"
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}